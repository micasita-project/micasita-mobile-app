# CP006: trazable al caso homónimo de catalog.json (Excel original).
appId: pe.edu.upc.micasita
---
- runFlow: common/catalog.yaml
- runFlow: common/start-recording.yaml
- assertVisible:
    id: "housing-list-count-10"
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element:
            id: "housing-list-count-20"
          direction: DOWN
          speed: 60
          timeout: 45000
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element:
            id: "housing-list-count-20"
          direction: DOWN
          timeout: 45000
- assertVisible:
    id: "housing-list-count-20"
- takeScreenshot: CP006-resultado
