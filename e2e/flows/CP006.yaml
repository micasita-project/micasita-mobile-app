# CP006: trazable al caso homónimo de catalog.json (Excel original).
appId: pe.edu.upc.micasita
---
- runFlow: common/start.yaml
- tapOn:
    text: "Viviendas(, tab, [0-9]+ of [0-9]+)?"
    waitToSettleTimeoutMs: 2000
- extendedWaitUntil:
    visible: ".*Filtros.*"
    timeout: 45000
- assertVisible:
    id: "housing-list-count-10"
- scrollUntilVisible:
    element:
      id: "housing-card-E2E Catalogo 10"
    direction: DOWN
    timeout: 45000
- assertVisible:
    id: "housing-list-count-20"
- takeScreenshot: CP006-resultado
