# CP008: trazable al caso homónimo de catalog.json (Excel original).
appId: pe.edu.upc.micasita
---
- runFlow: common/catalog.yaml
- runFlow: common/start-recording.yaml
- tapOn:
    text: ".*Filtros.*"
    waitToSettleTimeoutMs: 2000
- scrollUntilVisible:
    element:
      id: "filter-min-price"
    direction: DOWN
    timeout: 45000
- tapOn:
    waitToSettleTimeoutMs: 2000
    id: "filter-min-price"
- inputText: "1000"
- runFlow: common/hide-keyboard.yaml
- scrollUntilVisible:
    element:
      id: "filter-max-price"
    direction: DOWN
    timeout: 45000
- tapOn:
    waitToSettleTimeoutMs: 2000
    id: "filter-max-price"
- inputText: "1500"
- runFlow: common/hide-keyboard.yaml
- tapOn:
    text: ".*Aplicar filtros.*"
    waitToSettleTimeoutMs: 2000
- assertVisible:
    id: housing-list-count-10
- repeat:
    times: 5
    commands:
      - scroll
- takeScreenshot: CP008-resultado
