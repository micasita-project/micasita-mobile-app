# CP010: trazable al caso homónimo de catalog.json (Excel original).
appId: pe.edu.upc.micasita
---
- runFlow: common/user.yaml
- tapOn:
    text: "IA(, tab, [0-9]+ of [0-9]+)?"
    waitToSettleTimeoutMs: 2000
- scrollUntilVisible:
    element:
      text: ".*Generar recomendaciones.*"
    direction: DOWN
    timeout: 45000
- tapOn:
    text: ".*Generar recomendaciones.*"
    waitToSettleTimeoutMs: 2000
- extendedWaitUntil:
    visible: "Las más económicas en la zona parten desde.*"
    timeout: 45000
- assertVisible: ".*[Nn]o.*"
- takeScreenshot: CP010-resultado
