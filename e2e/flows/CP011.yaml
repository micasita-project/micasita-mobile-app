# CP011: trazable al caso homónimo de catalog.json (Excel original).
appId: pe.edu.upc.micasita
---
- runFlow: common/catalog.yaml
- runFlow: common/start-recording.yaml
- runFlow:
    file: common/filter-price.yaml
    env:
      MIN_PRICE: "1301"
      MAX_PRICE: "1301"
- extendedWaitUntil:
    visible: ".*Departamento luminoso en San Miguel.*"
    timeout: 45000
- tapOn:
    waitToSettleTimeoutMs: 2000
    id: "housing-card-Departamento luminoso en San Miguel"
- extendedWaitUntil:
    visible: ".*Departamento luminoso en San Miguel.*"
    timeout: 45000
- swipe:
    start: "85%,20%"
    end: "15%,20%"
    duration: 600
- assertVisible:
    id: "gallery-position-2"
- scrollUntilVisible:
    element:
      text: "Descripción"
    direction: DOWN
    timeout: 45000
- assertVisible: "Departamento luminoso y bien distribuido, cerca de parques y comercios."
- assertVisible: "Hab."
- assertVisible: "Baños"
- assertVisible: "m² total"
- takeScreenshot: CP011-resultado
