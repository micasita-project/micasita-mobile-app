# CP012: trazable al caso homónimo de catalog.json (Excel original).
appId: pe.edu.upc.micasita
---
- runFlow: common/user.yaml
- runFlow: common/open-catalog.yaml
- runFlow:
    file: common/filter-price.yaml
    env:
      MIN_PRICE: "1301"
      MAX_PRICE: "1301"
- runFlow: common/start-recording.yaml
- extendedWaitUntil:
    visible: ".*Departamento luminoso en San Miguel.*"
    timeout: 45000
- tapOn:
    waitToSettleTimeoutMs: 2000
    id: "housing-card-Departamento luminoso en San Miguel"
- extendedWaitUntil:
    visible: ".*Departamento luminoso en San Miguel.*"
    timeout: 45000
- scrollUntilVisible:
    element:
      text: "Tiempo a tu trabajo"
    direction: DOWN
    timeout: 45000
- assertVisible: "Tiempo a tu trabajo"
- assertVisible: ".*min.*"
- takeScreenshot: CP012-resultado
