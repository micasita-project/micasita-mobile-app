# CP016: trazable al caso homónimo de catalog.json (Excel original).
appId: pe.edu.upc.micasita
---
- runFlow: common/user.yaml
- tapOn:
    text: "IA(, tab, [0-9]+ of [0-9]+)?"
    waitToSettleTimeoutMs: 2000
- scrollUntilVisible:
    element:
      id: "recommend-insight-0"
    direction: DOWN
    timeout: 45000
- tapOn:
    waitToSettleTimeoutMs: 2000
    id: "recommend-insight-0"
- extendedWaitUntil:
    visible: "Análisis IA"
    timeout: 45000
- scrollUntilVisible:
    element:
      text: "¿Por qué este resultado?"
    direction: DOWN
    timeout: 45000
- assertVisible: "Tiempo al trabajo"
- assertVisible: "Precio mensual"
- scrollUntilVisible:
    element:
      text: "Área total"
    direction: DOWN
    timeout: 45000
- assertVisible: "Área total"
- assertVisible: "Distancia.*"
- takeScreenshot: CP016-resultado
