# CP017: trazable al caso homónimo de catalog.json (Excel original).
appId: pe.edu.upc.micasita
---
- runFlow: common/user.yaml
- runFlow: common/open-catalog.yaml
- runFlow:
    file: common/filter-price.yaml
    env:
      MIN_PRICE: "1301"
      MAX_PRICE: "1301"
- runFlow: common/start-recording.yaml
- extendedWaitUntil:
    visible: ".*Departamento luminoso en San Miguel.*"
    timeout: 45000
- tapOn:
    waitToSettleTimeoutMs: 2000
    id: "favorite-Departamento luminoso en San Miguel"
- assertVisible:
    id: favorite-Departamento luminoso en San Miguel
    selected: true
- tapOn:
    text: "Perfil(, tab, [0-9]+ of [0-9]+)?"
    waitToSettleTimeoutMs: 2000
- tapOn:
    text: ".*Favoritos.*"
    waitToSettleTimeoutMs: 2000
- extendedWaitUntil:
    visible: "Mis Favoritos"
    timeout: 45000
- assertVisible: ".*Departamento luminoso en San Miguel.*"
- takeScreenshot: CP017-resultado
