# CP023: trazable al caso homónimo de catalog.json (Excel original).
appId: pe.edu.upc.micasita
---
- runFlow: common/owner.yaml
- tapOn:
    text: "Viviendas(, tab, [0-9]+ of [0-9]+)?"
    waitToSettleTimeoutMs: 2000
- extendedWaitUntil:
    visible: ".*Filtros.*"
    timeout: 45000
- tapOn:
    text: ".*Publicar.*"
    waitToSettleTimeoutMs: 2000
- assertVisible: "Paso 1 de 4"
- runFlow: common/publish-step2.yaml
- tapOn:
    waitToSettleTimeoutMs: 2000
    id: "publish-next"
- assertVisible: "Datos incompletos"
- assertVisible: "Por favor ingresa el título del anuncio\\."
- tapOn:
    text: ".*OK.*"
    waitToSettleTimeoutMs: 2000
- assertVisible: "Paso 2 de 4"
- takeScreenshot: CP023-resultado
