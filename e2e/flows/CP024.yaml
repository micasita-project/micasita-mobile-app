# CP024: trazable al caso homónimo de catalog.json (Excel original).
appId: pe.edu.upc.micasita
---
- runFlow: common/owner.yaml
- tapOn:
    text: "Viviendas(, tab, [0-9]+ of [0-9]+)?"
    waitToSettleTimeoutMs: 2000
- extendedWaitUntil:
    visible: ".*Filtros.*"
    timeout: 45000
- tapOn:
    text: ".*Publicar.*"
    waitToSettleTimeoutMs: 2000
- assertVisible: "Paso 1 de 4"
- runFlow: common/publish-step3.yaml
- tapOn:
    waitToSettleTimeoutMs: 2000
    id: "add-photos"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          waitToSettleTimeoutMs: 2000
          text: "Photo taken on.*|Foto tomada.*"
          index: 0
      - tapOn:
          waitToSettleTimeoutMs: 2000
          text: "Photo taken on.*|Foto tomada.*"
          index: 0
      - tapOn:
          waitToSettleTimeoutMs: 2000
          text: "Photo taken on.*|Foto tomada.*"
          index: 0
      - tapOn:
          waitToSettleTimeoutMs: 2000
          text: "Photo taken on.*|Foto tomada.*"
          index: 0
      - tapOn:
          waitToSettleTimeoutMs: 2000
          text: "Photo taken on.*|Foto tomada.*"
          index: 0
      - tapOn:
          waitToSettleTimeoutMs: 2000
          text: "Done|Listo|Add.*|Añadir.*|Agregar.*"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: PXGGridLayout-Info
          index: 0
          waitToSettleTimeoutMs: 2000
      - tapOn:
          id: PXGGridLayout-Info
          index: 1
          waitToSettleTimeoutMs: 2000
      - tapOn:
          id: PXGGridLayout-Info
          index: 2
          waitToSettleTimeoutMs: 2000
      - tapOn:
          id: PXGGridLayout-Info
          index: 3
          waitToSettleTimeoutMs: 2000
      - tapOn:
          id: PXGGridLayout-Info
          index: 4
          waitToSettleTimeoutMs: 2000
      - tapOn:
          text: "OK"
          waitToSettleTimeoutMs: 2000
- assertVisible: '.*Agregar más fotos \(5/5\).*'
- tapOn:
    waitToSettleTimeoutMs: 2000
    id: "add-photos"
- assertVisible: "Límite alcanzado"
- assertVisible: "Puedes subir máximo 5 fotos\\."
- tapOn:
    text: ".*OK.*"
    waitToSettleTimeoutMs: 2000
- scrollUntilVisible:
    element:
      id: selected-photo-4
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "selected-photo-4"
- assertNotVisible:
    id: selected-photo-5
- takeScreenshot: CP024-resultado
