# CP025: trazable al caso homónimo de catalog.json (Excel original).
appId: pe.edu.upc.micasita
---
- runFlow: common/owner.yaml
- tapOn:
    text: "Viviendas(, tab, [0-9]+ of [0-9]+)?"
    waitToSettleTimeoutMs: 2000
- extendedWaitUntil:
    visible: ".*Filtros.*"
    timeout: 45000
- tapOn:
    text: ".*Publicar.*"
    waitToSettleTimeoutMs: 2000
- assertVisible: "Paso 1 de 4"
- runFlow: common/publish-step4.yaml
- scrollUntilVisible:
    element:
      id: "amenity-Gimnasio"
    direction: DOWN
    timeout: 45000
- tapOn:
    waitToSettleTimeoutMs: 2000
    id: "amenity-Gimnasio"
- assertVisible:
    id: "amenity-Gimnasio"
    selected: true
- scrollUntilVisible:
    element:
      id: "amenity-Piscina"
    direction: DOWN
    timeout: 45000
- tapOn:
    waitToSettleTimeoutMs: 2000
    id: "amenity-Piscina"
- assertVisible:
    id: "amenity-Piscina"
    selected: true
- scrollUntilVisible:
    element:
      id: "amenity-WiFi"
    direction: DOWN
    timeout: 45000
- tapOn:
    waitToSettleTimeoutMs: 2000
    id: "amenity-WiFi"
- assertVisible:
    id: "amenity-WiFi"
    selected: true
- tapOn:
    waitToSettleTimeoutMs: 2000
    id: "publish-submit"
- extendedWaitUntil:
    visible: "¡Publicado exitosamente!"
    timeout: 45000
- assertVisible: "Estado: Pendiente de validación"
- tapOn:
    text: ".*Ver mis publicaciones.*"
    waitToSettleTimeoutMs: 2000
- scrollUntilVisible:
    element:
      text: ".*E2E Nuevo CP025.*"
    direction: DOWN
    timeout: 45000
- assertVisible: ".*Pendiente.*"
- tapOn:
    waitToSettleTimeoutMs: 2000
    id: "listing-card-E2E Nuevo CP025"
- scrollUntilVisible:
    element:
      text: Características
    direction: DOWN
    timeout: 20000
- assertVisible: Gimnasio
- assertVisible: Piscina
- assertVisible: WiFi
- takeScreenshot: CP025-resultado
