# CP028: trazable al caso homónimo de catalog.json (Excel original).
appId: pe.edu.upc.micasita
---
- runFlow: common/owner.yaml
- runFlow: common/start-recording.yaml
- tapOn:
    text: ".*Mis publicaciones.*"
    waitToSettleTimeoutMs: 2000
- tapOn:
    waitToSettleTimeoutMs: 2000
    id: listings-filter-all
- assertVisible: "3 propiedades"
- scrollUntilVisible:
    element:
      text: ".*Departamento con vista al parque.*"
    direction: DOWN
    timeout: 20000
- assertVisible: ".*Departamento con vista al parque.*"
- scrollUntilVisible:
    element:
      text: "3 propiedades"
    direction: UP
    timeout: 15000
- scrollUntilVisible:
    element:
      text: ".*Departamento cerca de la universidad.*"
    direction: DOWN
    timeout: 20000
- assertVisible: ".*Departamento cerca de la universidad.*"
- scrollUntilVisible:
    element:
      text: "3 propiedades"
    direction: UP
    timeout: 15000
- scrollUntilVisible:
    element:
      text: ".*Minidepartamento cerca del mercado.*"
    direction: DOWN
    timeout: 20000
- assertVisible: ".*Minidepartamento cerca del mercado.*"
- takeScreenshot: CP028-resultado
