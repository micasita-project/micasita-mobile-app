# CP029: trazable al caso homónimo de catalog.json (Excel original).
appId: pe.edu.upc.micasita
---
- runFlow: common/owner.yaml
- runFlow: common/start-recording.yaml
- tapOn:
    text: ".*Mis publicaciones.*"
    waitToSettleTimeoutMs: 2000
- tapOn:
    waitToSettleTimeoutMs: 2000
    id: listings-filter-pending
- assertVisible: ".*Departamento cerca de la universidad.*"
- assertNotVisible: ".*Departamento con vista al parque.*"
- assertNotVisible: ".*Minidepartamento cerca del mercado.*"
- tapOn:
    waitToSettleTimeoutMs: 2000
    id: listings-filter-approved
- assertVisible: ".*Departamento con vista al parque.*"
- assertNotVisible: ".*Departamento cerca de la universidad.*"
- assertNotVisible: ".*Minidepartamento cerca del mercado.*"
- tapOn:
    waitToSettleTimeoutMs: 2000
    id: listings-filter-rejected
- assertVisible: ".*Minidepartamento cerca del mercado.*"
- assertNotVisible: ".*Departamento con vista al parque.*"
- assertNotVisible: ".*Departamento cerca de la universidad.*"
- takeScreenshot: CP029-resultado
