# CP030: trazable al caso homónimo de catalog.json (Excel original).
appId: pe.edu.upc.micasita
---
- runFlow: common/admin.yaml
- runFlow: common/start-recording.yaml
- assertVisible: ".*Departamento cerca de la universidad.*"
- scrollUntilVisible:
    element:
      text: ".*Departamento amplio en San Borja.*"
    direction: DOWN
    timeout: 45000
- assertVisible: ".*Departamento amplio en San Borja.*"
- scrollUntilVisible:
    element:
      text: ".*Departamento amoblado en Lince.*"
    direction: DOWN
    timeout: 45000
- assertVisible: ".*Departamento amoblado en Lince.*"
- takeScreenshot: CP030-resultado
