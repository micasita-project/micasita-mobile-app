# CP032: trazable al caso homónimo de catalog.json (Excel original).
appId: pe.edu.upc.micasita
---
- runFlow: common/admin.yaml
- runFlow: common/start-recording.yaml
- scrollUntilVisible:
    element:
      id: "approve-Departamento amplio en San Borja"
    direction: DOWN
    timeout: 45000
- tapOn:
    waitToSettleTimeoutMs: 2000
    id: "approve-Departamento amplio en San Borja"
- tapOn:
    text: ".*Sí, confirmar.*"
    waitToSettleTimeoutMs: 2000
- assertVisible: "La vivienda ha sido aprobada\\."
- tapOn:
    text: ".*OK.*"
    waitToSettleTimeoutMs: 2000
- assertNotVisible: ".*Departamento amplio en San Borja.*"
- runFlow: common/user.yaml
- runFlow: common/open-catalog.yaml
- runFlow:
    file: common/filter-price.yaml
    env:
      MIN_PRICE: "1501"
      MAX_PRICE: "1501"
- extendedWaitUntil:
    visible: ".*Departamento amplio en San Borja.*"
    timeout: 15000
- assertVisible: ".*Departamento amplio en San Borja.*"
- takeScreenshot: CP032-resultado
