# CP033: trazable al caso homónimo de catalog.json (Excel original).
appId: pe.edu.upc.micasita
---
- runFlow: common/admin.yaml
- runFlow: common/start-recording.yaml
- scrollUntilVisible:
    element:
      id: "reject-Departamento amoblado en Lince"
    direction: DOWN
    timeout: 45000
- tapOn:
    waitToSettleTimeoutMs: 2000
    id: "reject-Departamento amoblado en Lince"
- tapOn:
    id: admin-reject-confirm
    waitToSettleTimeoutMs: 2000
- assertVisible: "Motivo requerido"
- tapOn:
    text: ".*OK.*"
    waitToSettleTimeoutMs: 2000
- tapOn:
    id: admin-reject-reason
    waitToSettleTimeoutMs: 2000
- assertVisible:
    id: admin-reject-reason
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: admin-reject-reason
          focused: true
# XCTest no expone focused para este TextInput de iOS; las siguientes aserciones
# comprueban que el motivo escrito llegó al campo real.
- inputText: "Las fotos no son claras"
- assertVisible: "Las fotos no son claras"
- takeScreenshot: CP033-motivo-con-teclado
- tapOn:
    id: admin-reject-confirm
    waitToSettleTimeoutMs: 2000
- assertVisible: "La vivienda ha sido rechazada\\."
- tapOn:
    text: ".*OK.*"
    waitToSettleTimeoutMs: 2000
- runFlow: common/user.yaml
- runFlow: common/open-catalog.yaml
- runFlow:
    file: common/filter-price.yaml
    env:
      MIN_PRICE: "1601"
      MAX_PRICE: "1601"
- extendedWaitUntil:
    visible: "No se encontraron viviendas con estos filtros"
    timeout: 45000
- assertNotVisible: ".*Departamento amoblado en Lince.*"
- takeScreenshot: CP033-resultado
