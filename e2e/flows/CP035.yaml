# CP035: trazable al caso homónimo de catalog.json (Excel original).
appId: pe.edu.upc.micasita
---
- runFlow: common/admin.yaml
- tapOn:
    text: "Usuarios(, tab, [0-9]+ of [0-9]+)?"
    waitToSettleTimeoutMs: 2000
- tapOn:
    text: "Buscar por nombre o correo..."
    waitToSettleTimeoutMs: 2000
- inputText: "usuario@e2e-micasita.com"
- runFlow: common/hide-keyboard.yaml
- assertVisible: ".*usuario@e2e-micasita.com.*"
- assertNotVisible: ".*dueno@e2e-micasita.com.*"
- assertNotVisible: ".*admin@e2e-micasita.com.*"
- takeScreenshot: CP035-resultado
