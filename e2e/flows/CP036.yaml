# CP036: trazable al caso homónimo de catalog.json (Excel original).
appId: pe.edu.upc.micasita
---
- runFlow: common/admin.yaml
- runFlow: common/start-recording.yaml
- tapOn:
    text: "Usuarios(, tab, [0-9]+ of [0-9]+)?"
    waitToSettleTimeoutMs: 2000
- tapOn:
    text: "Buscar por nombre o correo..."
    waitToSettleTimeoutMs: 2000
- inputText: "diego.vargas@example.com"
- runFlow: common/hide-keyboard.yaml
- tapOn:
    waitToSettleTimeoutMs: 2000
    id: "user-status-diego.vargas@example.com"
- tapOn:
    text: ".*Sí, bloquear.*"
    waitToSettleTimeoutMs: 2000
- assertVisible: "Bloqueado"
- runFlow: common/user.yaml
- runFlow: common/open-catalog.yaml
- runFlow:
    file: common/filter-price.yaml
    env:
      MIN_PRICE: "1351"
      MAX_PRICE: "1351"
- extendedWaitUntil:
    visible: "No se encontraron viviendas con estos filtros"
    timeout: 45000
- assertNotVisible: ".*Departamento junto al centro comercial.*"
- takeScreenshot: CP036-resultado
