# CP040: al cerrar sesión desaparecen los datos de la cuenta.
appId: pe.edu.upc.micasita
---
- runFlow: common/start.yaml
- runFlow:
    file: common/login.yaml
    env:
      EMAIL: usuario@e2e-micasita.com
      PASSWORD: Test-1234
- extendedWaitUntil:
    visible: "Mapa(, tab, [0-9]+ of [0-9]+)?"
    timeout: 20000
- tapOn:
    text: "Perfil(, tab, [0-9]+ of [0-9]+)?"
    waitToSettleTimeoutMs: 2000
- assertVisible: "Usuario Prueba"
- tapOn:
    text: ".*Cerrar sesión.*"
    waitToSettleTimeoutMs: 2000
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: guest-setup-close
          timeout: 30000
      - runFlow: common/dismiss_guest_setup.yaml
      - tapOn:
          text: "Perfil(, tab, [0-9]+ of [0-9]+)?"
          waitToSettleTimeoutMs: 2000
- assertVisible: ".*Iniciar sesión.*"
- assertNotVisible: ".*usuario@e2e-micasita.com.*"
- stopApp
- runFlow: common/relaunch.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: guest-setup-close
          timeout: 30000
      - runFlow: common/dismiss_guest_setup.yaml
- extendedWaitUntil:
    visible: "Mapa(, tab, [0-9]+ of [0-9]+)?"
    timeout: 20000
- runFlow: common/dismiss_guest_setup.yaml
- tapOn:
    text: "Perfil(, tab, [0-9]+ of [0-9]+)?"
    waitToSettleTimeoutMs: 2000
- assertVisible: ".*Iniciar sesión.*"
- assertNotVisible: ".*usuario@e2e-micasita.com.*"
- takeScreenshot: sesion-cerrada
