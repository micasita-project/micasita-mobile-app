# CP041: relanzar el proceso conserva la sesión sin volver a ingresar credenciales.
appId: pe.edu.upc.micasita
---
- runFlow: common/start-login.yaml
- runFlow: common/start-recording.yaml
- runFlow:
    file: common/login.yaml
    env:
      EMAIL: camila.rojas@example.com
      PASSWORD: Primavera2026!
- extendedWaitUntil:
    visible: "Mapa(, tab, [0-9]+ of [0-9]+)?"
    timeout: 20000
- stopApp
- runFlow: common/relaunch.yaml
- extendedWaitUntil:
    visible: "Mapa(, tab, [0-9]+ of [0-9]+)?"
    timeout: 20000
- tapOn:
    text: "Perfil(, tab, [0-9]+ of [0-9]+)?"
    waitToSettleTimeoutMs: 2000
- assertVisible: "Camila Rojas"
- assertVisible: ".*camila.rojas@example.com.*"
- assertVisible: ".*Cerrar sesión.*"
- takeScreenshot: sesion-restaurada
