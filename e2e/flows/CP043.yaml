# CP043: trazable al caso homónimo de catalog.json (Excel original).
appId: pe.edu.upc.micasita
---
- runFlow: common/catalog.yaml
- runFlow: common/start-recording.yaml
- runFlow:
    file: common/filter-price.yaml
    env:
      MIN_PRICE: "1301"
      MAX_PRICE: "1301"
- extendedWaitUntil:
    visible: ".*Departamento luminoso en San Miguel.*"
    timeout: 45000
- tapOn:
    waitToSettleTimeoutMs: 2000
    id: "housing-card-Departamento luminoso en San Miguel"
- extendedWaitUntil:
    visible: ".*Departamento luminoso en San Miguel.*"
    timeout: 45000
- tapOn:
    text: ".*Contactar por WhatsApp.*"
    waitToSettleTimeoutMs: 2000
- extendedWaitUntil:
    visible: "Hola, vi el anuncio.*"
    timeout: 45000
- assertVisible: ".*987.?654.?321.*"
- takeScreenshot: CP043-resultado
