# CP045: trazable al caso homónimo de catalog.json (Excel original).
appId: pe.edu.upc.micasita
---
- runFlow: common/owner.yaml
- runFlow: common/start-recording.yaml
- tapOn:
    text: ".*Mis publicaciones.*"
    waitToSettleTimeoutMs: 2000
- scrollUntilVisible:
    element:
      id: "edit-Minidepartamento cerca del mercado"
    direction: DOWN
    timeout: 45000
- assertVisible: ".*Motivo: Fotos borrosas.*"
- tapOn:
    waitToSettleTimeoutMs: 2000
    id: "edit-Minidepartamento cerca del mercado"
- assertVisible: "Paso 1 de 4"
- runFlow: common/publish-next.yaml
- scrollUntilVisible:
    element:
      id: "publish-price"
    direction: DOWN
    timeout: 45000
- tapOn:
    waitToSettleTimeoutMs: 2000
    id: "publish-price"
- eraseText
- inputText: "1450"
- runFlow: common/hide-keyboard.yaml
- runFlow: common/publish-next.yaml
- assertVisible: "Paso 3 de 4"
- runFlow: common/publish-next.yaml
- assertVisible: "Paso 4 de 4"
- tapOn:
    waitToSettleTimeoutMs: 2000
    id: "publish-submit"
- extendedWaitUntil:
    visible: "¡Actualizado exitosamente!"
    timeout: 45000
- tapOn:
    text: ".*Ver mis publicaciones.*"
    waitToSettleTimeoutMs: 2000
- scrollUntilVisible:
    element:
      text: ".*Minidepartamento cerca del mercado.*"
    direction: DOWN
    timeout: 45000
- assertVisible: ".*Pendiente.*"
- takeScreenshot: CP045-resultado
