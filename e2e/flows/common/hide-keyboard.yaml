appId: pe.edu.upc.micasita
---
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          when:
            visible:
              id: inputView
          commands:
            - swipe:
                start: 90%,50%
                end: 90%,35%
                duration: 400
            - runFlow:
                when:
                  visible:
                    id: inputView
                commands:
                  - swipe:
                      start: 50%,45%
                      end: 50%,30%
                      duration: 400
      - assertNotVisible:
          id: inputView
