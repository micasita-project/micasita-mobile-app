# Navegación real al catálogo; no modifica sesión ni datos.
appId: pe.edu.upc.micasita
---
- runFlow:
    when:
      platform: Android
    commands:
      - openLink:
          link: micasitaapp://housing
          autoVerify: true
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Viviendas(, tab, [0-9]+ of [0-9]+)?"
          waitToSettleTimeoutMs: 2000
- extendedWaitUntil:
    visible: ".*Filtros.*"
    timeout: 45000
- runFlow: dismiss-dev-warning.yaml
