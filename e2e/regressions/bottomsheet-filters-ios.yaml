# Regresión: mantener visibles los cuatro campos de filtros con el teclado abierto.
appId: pe.edu.upc.micasita
---
- runFlow: ../flows/common/start.yaml
- tapOn:
    text: 'Viviendas(, tab, [0-9]+ of [0-9]+)?'
- tapOn: '.*Filtros.*'
- scrollUntilVisible:
    element:
      id: filter-max-price
    direction: DOWN
    timeout: 15000
- tapOn:
    id: filter-max-price
- inputText: '1500'
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: inputView
- assertVisible:
    id: filter-max-price
- takeScreenshot: filtros-precio-maximo
- tapOn:
    id: filter-min-price
- inputText: '1000'
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: inputView
- takeScreenshot: filtros-precio-minimo
- scrollUntilVisible:
    element:
      id: filter-min-area
    direction: UP
- tapOn:
    id: filter-min-area
- inputText: '50'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: filtros-area
- repeat:
    times: 3
    commands:
      - swipe:
          start: 50%,25%
          end: 50%,45%
          duration: 500
- assertVisible:
    id: filter-district
- tapOn:
    id: filter-district
- inputText: 'San Miguel'
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: inputView
- takeScreenshot: filtros-distrito
