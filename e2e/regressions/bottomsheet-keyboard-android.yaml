# Regresión Android: campos visibles por encima del teclado y del pie fijo.
appId: pe.edu.upc.micasita
---
- runFlow: ../flows/common/start.yaml
- tapOn: '.*Viviendas.*'
- tapOn: '.*Filtros.*'
- scrollUntilVisible:
    element:
      id: filter-max-price
    direction: DOWN
    timeout: 20000
- tapOn:
    id: filter-max-price
- inputText: '1500'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: android-precio-maximo
- assertVisible: '1500'
- tapOn:
    id: filter-min-price
- inputText: '1000'
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: '1000'
- takeScreenshot: android-precio-minimo
- tapOn:
    id: filter-min-area
- inputText: '50'
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: '50'
- takeScreenshot: android-area
- repeat:
    times: 3
    commands:
      - swipe:
          start: 50%,25%
          end: 50%,45%
          duration: 500
- tapOn:
    id: filter-district
- inputText: 'San Miguel'
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: 'San Miguel'
- takeScreenshot: android-distrito
