# Regresión: diez aperturas y cierres consecutivos de filtros.
appId: pe.edu.upc.micasita
---
- runFlow: ../flows/common/start.yaml
- tapOn:
    text: 'Viviendas(, tab, [0-9]+ of [0-9]+)?'
- repeat:
    times: 10
    commands:
      - tapOn:
          text: '.*Filtros.*'
          waitToSettleTimeoutMs: 100
      - extendedWaitUntil:
          visible:
            id: filter-district
          timeout: 5000
      - tapOn:
          point: '50%,12%'
          waitToSettleTimeoutMs: 100
      - extendedWaitUntil:
          notVisible:
            id: filter-district
          timeout: 5000
- takeScreenshot: filtros-diez-aperturas
